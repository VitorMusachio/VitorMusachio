name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=VitorMusachio&show_icons=true&theme=transparent&hide_border=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=VitorMusachio&layout=compact&theme=transparent&hide_border=true&hide=jupyter%20notebook,html,css,plpgsql
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card, discogs-data-lake
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=VitorMusachio&repo=discogs-data-lake&theme=transparent&hide_border=true
          path: profile/pin-discogs-data-lake.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card, Awari course
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=VitorMusachio&repo=awari-by-fluency-engenharia-de-dados&theme=transparent&hide_border=true
          path: profile/pin-awari-engenharia-de-dados.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VitorMusachio
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
